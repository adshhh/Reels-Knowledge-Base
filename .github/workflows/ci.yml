# Runs on every push and pull request: formatting, lint, type check and the unit tests.
# Installs only the light dependencies. Unit tests never load a model or touch the network
# (tests/conftest.py enforces it), and the archive is never in the repo, so CI sees fake
# data only. See docs/DESIGN_RATIONALE.md §7.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy .
      - name: Unit tests
        run: pytest
