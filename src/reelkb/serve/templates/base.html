<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reel Knowledge Base{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="/">Reel Knowledge Base</a>
      <form class="search" method="get" action="/search">
        <input type="search" name="q" placeholder="Search everything you've saved"
               value="{{ q|default('') }}" aria-label="Search">
      </form>
    </div>
  </header>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  <footer class="site">
    <a href="/hidden">Hidden items</a>
  </footer>
</body>
</html>
